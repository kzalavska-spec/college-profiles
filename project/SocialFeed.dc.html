<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:620},&quot;networks&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Both&quot;,&quot;Instagram only&quot;,&quot;TikTok only&quot;],&quot;default&quot;:&quot;Both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Instagram&quot;,&quot;TikTok&quot;],&quot;default&quot;:&quot;Instagram&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;}}">class Component extends DCLogic {
  state = { tab: null, op: 1, idx: 0 };
  switchTab(t) {
    if (t === this.current()) return;
    this.setState({ op: 0 });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ tab: t, op: 1, idx: 0 }), 150);
  }
  current() {
    const n = this.props.networks ?? 'Both';
    if (n === 'Instagram only') return 'ig';
    if (n === 'TikTok only') return 'tt';
    return this.state.tab ?? (this.props.defaultTab === 'TikTok' ? 'tt' : 'ig');
  }
  renderVals() {
    const n = this.props.networks ?? 'Both';
    const mobile = this.props.mobile ?? false;
    const cur = this.current();

    const TTP = 'M16.6 5.8a4.3 4.3 0 0 1-1-2.8h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.3-1.6z';
    const ig = [
      { id: 'ig-post-1', src: (window.__resources || {}).igPost1 || 'assets/ig-post-1.png', caption: '...and all that jazz @grinnelltdps put on a musical...', ago: 'Less than a day ago' },
      { id: 'ig-post-2', src: (window.__resources || {}).igPost2 || 'assets/ig-post-2.png', caption: 'transcending the game #LiveGrinnellian...', ago: '1 week ago' },
      { id: 'ig-post-3', src: (window.__resources || {}).igPost3 || 'assets/ig-post-3.png', caption: 'What was your First-Year Tutorial class? #...', ago: '2 weeks ago' }
    ].map(p => ({ ...p, hasSrc: true, isSlot: false, isVideo: false, views: '', aria: 'Open Instagram post: ' + p.caption, iconPath: IGP, iconFill: 'none', iconStroke: '#2C303C' }));
    const tt = [
      { id: 'tt-cover-1', caption: 'Dorm room tour 2026: what a Grinnell double really looks like', ago: '2 days ago', views: '14.2K' },
      { id: 'tt-cover-2', caption: 'Day in the life of a Grinnell first-year, from Tutorial to the Bear', ago: '5 days ago', views: '45.1K' },
      { id: 'tt-cover-3', caption: 'Dining hall tier list, ranked by people who eat there every day', ago: '1 week ago', views: '8.9K' },
      { id: 'tt-cover-4', caption: 'Best study spots on campus during finals week', ago: '2 weeks ago', views: '21.6K' }
    ].map((p, i) => ({ ...p, src: ['1555854877-bab0e564b8d5', '1606761568499-6d2451b23c66', '1567521464027-f127ff144326', '1427504494785-3a9ca7044f45'].map((id, k) => (window.__resources || {})['ttCover' + (k + 1)] || 'https://images.unsplash.com/photo-' + id + '?w=480&h=600&fit=crop')[i], hasSrc: true, isSlot: false, isVideo: true, aria: 'Watch on TikTok: ' + p.caption, iconPath: TTP, iconFill: '#2C303C', iconStroke: 'none' }));
    const compact = this.props.compact ?? false;
    const count = this.props.count ?? 3;
    const posts = (cur === 'tt' ? tt : ig).slice(0, count);
    const both = n === 'Both';
    const mk = (key, label) => ({ key, label, active: cur === key, isIg: key === 'ig', isTt: key === 'tt',
      bg: cur === key ? '#fff' : 'transparent', color: cur === key ? '#2C303C' : '#515767', border: cur === key ? '#D3D7DC' : 'transparent',
      select: () => this.switchTab(key) });
    return {
      isDesktop: !mobile, isMobile: mobile,
      compact: compact && !mobile, fullHeader: !compact, showCaption: !compact,
      cols: 'repeat(' + posts.length + ',minmax(0,1fr))', gridGap: compact ? '12px' : '16px',
      showTabs: both, showLogo: !both, isIg: cur === 'ig', isTt: cur === 'tt',
      tabs: [mk('ig', 'Instagram'), mk('tt', 'TikTok')],
      acct: cur === 'tt' ? { handle: '@grinnellcollege', followLabel: 'Follow Grinnell College on TikTok' } : { handle: 'grinnellcollege', followLabel: 'Follow Grinnell College on Instagram' },
      posts, op: this.state.op,
      dots: posts.map((_, i) => ({ bg: i === this.state.idx ? '#1263D3' : '#D3D7DC' })),
      onScroll: e => { const el = e.currentTarget; const w = el.firstElementChild ? el.firstElementChild.offsetWidth + 12 : 1; const i = Math.min(posts.length - 1, Math.round(el.scrollLeft / w)); if (i !== this.state.idx) this.setState({ idx: i }); }
